name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: git diff --exit-code -- homecall-card.js
      - name: Verify version
        run: node -e 'if(process.env.GITHUB_REF_NAME!=="v"+require("./package.json").version)process.exit(1)'
      - name: Publish release with standard notes
        run: |
          previous_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          python3 scripts/release-notes.py --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --previous-tag "$previous_tag" --validation "Formatting, build, Node tests, Chromium/WebKit browser checks, and distribution checks passed in the release workflow." > release-notes.md
          gh release create "$GITHUB_REF_NAME" homecall-card.js --verify-tag --title "$GITHUB_REF_NAME — $(cat RELEASE_TITLE.txt)" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
