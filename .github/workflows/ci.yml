name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: git diff --exit-code -- homecall-card.js
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: browser-traces
          path: test-results/
          retention-days: 7
